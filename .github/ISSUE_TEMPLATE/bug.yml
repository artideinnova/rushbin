name: Bug
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "A security problem? Do not open an issue: see SECURITY.md."
  - type: input
    id: version
    attributes:
      label: Version
      description: "The app's version (rushbin, About), or the commit of your team site"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Mac app, Windows app, Team site on rushbin.io, Self-hosted team site]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      placeholder: "1. ...\n2. ..."
  - type: textarea
    id: logs
    attributes:
      label: Log lines, if any
      description: Remove names of people, clients and files you do not want public.
      render: text
