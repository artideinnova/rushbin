<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="login.pageTitle"></title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#121214">
<meta name="apple-mobile-web-app-title" content="rushbin">
<script src="/i18n.js"></script>
<style>
  :root { --ink: #f5f5f7; --ink-2: rgba(235,235,245,.64); --ink-3: rgba(235,235,245,.36); --fill: rgba(120,120,128,.2);
    --line: rgba(255,255,255,.09); --accent: #ff681d; --red: #ff453a; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: #121214; color: var(--ink);
    font: 400 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
  main { width: min(380px, 100%); }
  h1 { font: 700 26px/1.1 -apple-system, "SF Pro Display", sans-serif; letter-spacing: -.02em; margin: 0 0 6px; }
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 30px; } .brand .word { height: 24px; width: auto; }
  p { color: var(--ink-2); margin: 0 0 22px; }
  label { display: block; font-size: 13px; color: var(--ink-2); margin: 14px 0 6px; }
  input { width: 100%; height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid transparent; background: var(--fill); color: inherit; font: inherit; }
  input:focus { outline: none; border-color: rgba(255,104,29,.7); }
  button { width: 100%; height: 46px; margin-top: 22px; border: 0; border-radius: 999px; background: var(--accent); color: #20120a; font: 600 15px/1 -apple-system, sans-serif; cursor: pointer; }
  button:disabled { opacity: .5; }
  .btn { display: grid; place-items: center; height: 46px; margin-top: 22px; border-radius: 999px; background: var(--accent); color: #20120a; font: 600 15px/1 -apple-system, sans-serif; text-decoration: none; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); margin-top: 12px; }
  .small { margin: 18px 0 0; font-size: 13px; } .small + .small { margin-top: 8px; }
  a { color: var(--accent); }
  .check { display: flex; gap: 10px; align-items: flex-start; margin-top: 18px; line-height: 1.4; }
  .check input { width: 18px; height: 18px; flex: none; margin: 1px 0 0; accent-color: var(--accent); }
  .lang { margin-top: 34px; } .lang select { height: 34px; border-radius: 10px; border: 0; background: var(--fill); color: var(--ink-2); font: inherit; font-size: 13px; padding: 0 8px; }
  .err { color: var(--red); min-height: 1.4em; margin: 14px 0 0; font-size: 14px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <div class="brand"><img src="/logo.svg" alt="" width="44" height="44"><img src="/wordmark.svg" alt="rushbin" class="word"></div>
  <h1 id="title"></h1>
  <p id="sub"></p>
  <form id="form" novalidate></form>
  <p class="err" id="err" role="alert"></p>
  <div class="lang" id="lang"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const { t } = I18N;
const field = (id, label, type = 'text', auto = '') =>
  `<label for="${id}">${label}</label><input id="${id}" name="${id}" type="${type}" autocomplete="${auto}" required>`;
const esc = v => String(v).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const link = new URLSearchParams(location.hash.slice(1));
const mode = ['invite', 'reset', 'setup', 'forgot'].find(k => link.has(k)) || 'login';
const H = { 'X-Rushbin': '1', 'Content-Type': 'application/json' };
addEventListener('hashchange', () => location.reload()); // the links between the forms below
let SITE = {};
$('#lang').innerHTML = I18N.picker();
// The site's messages are English: I18N.from says them in the page's language.
const failed = async r => r ? I18N.from((await r.text()).trim()) : t('login.noanswer');

function start() {
  const f = $('#form'), say = (title, sub) => { $('#title').textContent = title; $('#sub').textContent = sub; };
  const pass = field('password', t('login.newPassword'), 'password', 'new-password');
  const owner = field('team_name', t('login.teamName'), 'text', 'organization') + field('name', t('login.yourName'), 'text', 'name') + field('email', t('login.yourEmail'), 'email', 'username') + pass;
  if (mode === 'invite') {
    say(t('login.joinTitle'), t('login.joinSub'));
    f.innerHTML = field('name', t('login.yourName'), 'text', 'name') + pass + `<button>${t('login.join')}</button>`;
  } else if (mode === 'reset') {
    say(t('login.resetTitle'), t('login.resetSub'));
    f.innerHTML = field('password', t('pw.new'), 'password', 'new-password') + `<button>${t('login.resetGo')}</button>`;
  } else if (mode === 'setup') {
    say(t('login.setupTitle'), t('login.setupSub'));
    f.innerHTML = owner + `<button>${t('login.create')}</button>`;
  } else if (mode === 'forgot') {
    say(t('login.resetTitle'), t('login.forgotSub'));
    f.innerHTML = field('email', t('email'), 'email', 'username') + `<button>${t('login.sendLink')}</button><p class="small"><a href="#">${t('login.back')}</a></p>`;
  } else if (SITE.setup) { // no team, no one to sign in
    say(t('login.setupTitle'), t('login.noTeam'));
    return;
  } else {
    say(t('login.title'), t('login.sub'));
    f.innerHTML = field('email', t('email'), 'email', 'username') + field('password', t('password'), 'password', 'current-password') + `<button>${t('login.go')}</button>`
      + (SITE.mail ? `<p class="small"><a href="#forgot">${t('login.forgot')}</a></p>` : `<p class="small">${t('login.forgotAsk')}</p>`);
  }
  f.querySelector('input, button').focus();
}

// After joining or creating a team: connect the app on this Mac, without typing (a rushbin://connect link).
async function connectMac() {
  const r = await fetch('/api/team/pair', { method: 'POST', headers: H }).catch(() => null);
  if (!r?.ok) { location.href = '/'; return; } // a viewer: no Mac to connect
  const { url } = await r.json();
  history.replaceState(null, '', '/login');
  $('#title').textContent = t('login.inTitle');
  $('#sub').textContent = t('login.inSub');
  $('#form').innerHTML = `<a class="btn" id="open">${t('login.open')}</a><a class="btn ghost" href="/">${t('login.continue')}</a>
    <p class="small">${t('login.inNote')}</p>`;
  $('#open').href = url;
  $('#open').focus();
}

$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  const body = Object.fromEntries(new FormData(e.target));
  if (link.has(mode)) body.token = link.get(mode);
  const b = e.target.querySelector('button'); b.disabled = true; $('#err').textContent = '';
  const path = { login: '/api/auth/login', invite: '/api/auth/join', reset: '/api/auth/reset', setup: '/api/auth/setup',
    forgot: '/api/auth/forgot' }[mode];
  const r = await fetch(path, { method: 'POST', headers: H, body: JSON.stringify(body) }).catch(() => null);
  if (r?.ok && mode === 'forgot') {
    $('#title').textContent = t('login.checkMail');
    $('#sub').innerHTML = t('login.sentReset', { email: esc(body.email) });
    $('#form').innerHTML = '';
    return;
  }
  if (r?.ok && ['invite', 'setup'].includes(mode)) return connectMac();
  if (r?.ok) { history.replaceState(null, '', '/login'); location.href = '/'; return; }
  $('#err').textContent = await failed(r);
  b.disabled = false;
});
fetch('/api/site').then(r => r.json()).catch(() => ({})).then(s => { SITE = s; start(); });
</script>
</body>
</html>
