<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>rushbin</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#121214">
<meta name="apple-mobile-web-app-title" content="rushbin">
<script src="/i18n.js"></script>
<style>
  :root {
    --bg: #121214; /* never pure black or pure white: Davide's rule, also in logos */
    --glass: rgba(30, 30, 32, .58);
    --glass-strong: rgba(36, 36, 40, .78);
    --pop: rgba(34, 34, 38, .97); /* menus inside the bar: nested blur does not work, they need a solid fill */
    --glass-line: rgba(255, 255, 255, .09);
    --glass-hi: rgba(255, 255, 255, .07);
    --fill: rgba(120, 120, 128, .2);
    --fill-2: rgba(120, 120, 128, .32);
    --ink: #f5f5f7;
    --ink-2: rgba(235, 235, 245, .64);
    --ink-3: rgba(235, 235, 245, .36);
    --accent: #ff681d; /* rushbin orange; text on it is near black */
    --on-accent: #20120a;
    --red: #ff453a;
    --teal: #ffa477; /* light orange: secondary accents (copies, savings, progress) */
    --green: #30d158;
    --amber: #ffd60a;
    --r-tile: 16px;
    --blur: blur(30px) saturate(180%);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { background: var(--bg); }
  body {
    margin: 0; min-height: 100vh; color: var(--ink); background: var(--bg);
    font: 400 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased; letter-spacing: -.005em;
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .glass { background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border: 1px solid var(--glass-line); box-shadow: inset 0 1px 0 var(--glass-hi); }

  /* Ambient light: the colors of the clip under the pointer, blurred behind everything */
  .ambient { position: fixed; inset: -10%; z-index: 0; pointer-events: none; opacity: .55; transition: opacity .6s; }
  .ambient div { position: absolute; inset: 0; background-size: cover; background-position: center; filter: blur(90px) saturate(1.6); transition: opacity .8s; }
  .ambient::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 0%, transparent 0%, rgba(18,18,20,.55) 55%, var(--bg) 100%); }
  .app { position: relative; z-index: 1; }

  /* Glass bar */
  .bar { position: sticky; top: 0; z-index: 10; border-width: 0 0 1px; border-radius: 0; }
  .bar-in { max-width: 1600px; margin: 0 auto; padding: 12px 28px 14px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; }
  .brand { display: flex; align-items: center; } .brand img { height: 22px; width: auto; display: block; }
  .brand small { font-weight: 500; color: var(--ink-3); margin-left: 6px; font-size: 13px; letter-spacing: 0; }
  .seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--fill); }
  .seg button { border: 0; background: none; padding: 6px 16px; border-radius: 999px; cursor: pointer; color: var(--ink-2); font-weight: 500; font-size: 13px; transition: background .2s, color .2s; }
  .seg button[aria-selected="true"] { background: rgba(255,255,255,.16); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  #bgnote { display: block; font-size: 11.5px; color: var(--ink-3); text-align: right; }
  .stat { justify-self: end; color: var(--ink-2); font-size: 13px; font-variant-numeric: tabular-nums; }

  /* Token search */
  .searchrow { max-width: 1600px; margin: 0 auto; padding: 0 28px 14px; display: flex; gap: 10px; align-items: center; }
  .search { position: relative; flex: 1; }
  .field { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: 46px; padding: 7px 14px 7px 42px; border-radius: 999px; background: var(--fill); border: 1px solid transparent; cursor: text; transition: background .2s, border-color .2s; }
  .field:focus-within { background: rgba(120,120,128,.26); border-color: rgba(255,104,29,.65); }
  .field > svg { position: absolute; left: 16px; top: 15px; color: var(--ink-3); }
  .field input { flex: 1; min-width: 160px; border: 0; background: none; outline: none; font-size: 16px; padding: 4px 0; }
  .field input::placeholder { color: var(--ink-3); }
  .field kbd { font: 500 12px/1 -apple-system, sans-serif; color: var(--ink-3); background: var(--fill); border-radius: 6px; padding: 4px 7px; }
  .token { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 6px 0 12px; border-radius: 999px; background: rgba(255,104,29,.2); color: #ffd6c2; font-size: 13px; font-weight: 500; white-space: nowrap; }
  .token span { color: rgba(255,214,194,.65); font-weight: 400; }
  .token button { width: 20px; height: 20px; border: 0; border-radius: 50%; background: rgba(255,255,255,.12); cursor: pointer; display: grid; place-items: center; padding: 0; }
  .token button:hover { background: rgba(255,255,255,.24); }

  .suggest { position: absolute; left: 0; right: 0; top: calc(100% + 8px); border-radius: 18px; padding: 8px; max-height: min(60vh, 520px); overflow-y: auto; background: var(--pop); display: none; box-shadow: 0 24px 60px rgba(0,0,0,.55), inset 0 1px 0 var(--glass-hi); }
  .suggest.open { display: block; }
  .suggest h6 { margin: 10px 12px 4px; font-size: 12px; font-weight: 600; color: var(--ink-3); }
  .suggest button { display: flex; width: 100%; align-items: center; gap: 12px; border: 0; background: none; text-align: left; padding: 8px 12px; border-radius: 10px; cursor: pointer; }
  .suggest button[aria-selected="true"], .suggest button:hover { background: var(--accent); color: var(--on-accent); }
  .suggest button[aria-selected="true"] .meta, .suggest button:hover .meta { color: rgba(0,0,0,.65); }
  .suggest .ico { width: 26px; height: 26px; border-radius: 7px; background: var(--fill-2); display: grid; place-items: center; flex: none; font-size: 13px; }
  .suggest .meta { margin-left: auto; color: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; }
  .suggest mark { background: none; color: inherit; font-weight: 700; }

  .sort { position: relative; }
  #drivemenu button { display: flex; align-items: center; gap: 8px; } #drivemenu .dot { flex: none; }
  .pillbtn { height: 46px; padding: 0 18px; border-radius: 999px; border: 0; background: var(--fill); cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
  .pillbtn:hover { background: var(--fill-2); }
  .menu { position: absolute; right: 0; top: calc(100% + 8px); min-width: 210px; border-radius: 14px; padding: 6px; background: var(--pop); display: none; z-index: 12; box-shadow: 0 24px 60px rgba(0,0,0,.55); }
  .menu.open { display: block; }
  .menu button { display: flex; width: 100%; justify-content: space-between; border: 0; background: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; text-align: left; }
  .menu button:hover { background: var(--accent); color: var(--on-accent); }

  .quick { max-width: 1600px; margin: 0 auto; padding: 0 28px 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { height: 30px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--glass-line); background: rgba(255,255,255,.04); cursor: pointer; font-size: 13px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 7px; transition: background .15s, color .15s, border-color .15s; }
  .chip:hover { color: var(--ink); background: rgba(255,255,255,.08); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
  .chip i { width: 7px; height: 7px; border-radius: 50%; }

  /* Results */
  main { max-width: 1600px; margin: 0 auto; padding: 8px 28px 120px; }
  .section { margin-top: 26px; }
  .section header { position: sticky; top: 132px; z-index: 5; display: flex; align-items: baseline; gap: 12px; padding: 10px 0; }
  .section h2 { margin: 0; font: 700 26px/1.1 -apple-system, "SF Pro Display", sans-serif; letter-spacing: -.025em; text-shadow: 0 2px 18px rgba(0,0,0,.6); }
  .section header p { margin: 0; color: var(--ink-2); font-size: 13px; text-shadow: 0 1px 10px rgba(0,0,0,.8); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px 14px; }
  .tile { position: relative; border: 0; padding: 0; background: none; cursor: pointer; text-align: left; border-radius: var(--r-tile); }
  .frame { position: relative; aspect-ratio: 16 / 9; border-radius: var(--r-tile); overflow: hidden; background: #111; box-shadow: 0 8px 24px rgba(0,0,0,.35); transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s; }
  .tile:hover .frame, .tile.sel .frame { transform: scale(1.025); box-shadow: 0 18px 40px rgba(0,0,0,.6); }
  .tile.sel .frame { outline: 3px solid var(--accent); outline-offset: 2px; }
  .frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .frame.vert img { object-fit: contain; background: #0b0b0b; }
  .frame .noimg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-3); font-size: 12px; }
  .scrub { position: absolute; left: 10px; right: 10px; bottom: 8px; display: flex; gap: 3px; opacity: 0; transition: opacity .2s; }
  .scrub i { flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,.3); }
  .scrub i.on { background: var(--ink); }
  .tile:hover .scrub { opacity: 1; }
  .badges { position: absolute; top: 8px; left: 8px; display: flex; gap: 5px; }
  .badge { height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; background: rgba(0,0,0,.45); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  .badge.red i { width: 6px; height: 6px; border-radius: 50%; background: var(--red); }
  .badge.copy { color: var(--teal); }
  .dur { position: absolute; right: 8px; bottom: 8px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; background: rgba(0,0,0,.5); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); transition: opacity .2s; }
  .tile:hover .dur { opacity: 0; }
  .cap { padding: 9px 4px 0; }
  .cap b { display: block; font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cap span { display: block; color: var(--ink-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cap .on-disk { display: flex; align-items: center; gap: 6px; } .on-disk .dot { flex: none; width: 6px; height: 6px; }
  .ondisks { margin: 0 0 14px; color: var(--ink-2); font-size: 13px; }
  .ondisks button { font: inherit; color: var(--ink); background: var(--fill); border: 1px solid var(--glass-line); border-radius: 999px; padding: 3px 10px; margin: 2px 2px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .disk-card.gone { opacity: .62; }
  dd.opt { display: flex; align-items: flex-start; gap: 10px; }
  .switch { flex: none; width: 38px; height: 22px; margin-top: 1px; border-radius: 999px; border: 0; padding: 0; position: relative; cursor: pointer;
    background: rgba(120,120,128,.32); transition: background .25s cubic-bezier(.4,0,.2,1); }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--ink);
    box-shadow: 0 1px 3px rgba(10,10,12,.35); transition: transform .25s cubic-bezier(.4,0,.2,1); }
  .switch[aria-checked="true"] { background: var(--accent); } .switch[aria-checked="true"]::after { transform: translateX(16px); }
  @media (prefers-reduced-motion: reduce) { .switch, .switch::after { transition: none; } }
  .disk-acts { margin-top: 16px; align-items: center; }
  .disk-card { position: relative; } .disk-card:has(.dmore[open]) { z-index: 5; } /* the menu above the next card */
  .dmore { position: relative; display: inline-flex; } .dmore summary { list-style: none; display: inline-flex; align-items: center; gap: 6px; }
  .dmore summary::-webkit-details-marker { display: none; } .dmore[open] .menu { display: block; left: auto; right: 0; bottom: calc(100% + 8px); top: auto; }
  .dmore .menu button { width: 100%; text-align: left; }
  .more { margin: 20px auto 0; display: block; }
  /* Collapsible projects: closed ones show only covers and numbers */
  .sec-head { display: flex; align-items: center; gap: 14px; width: 100%; border: 0; background: none; padding: 0; cursor: pointer; text-align: left; }
  .sec-head .chev { width: 28px; height: 28px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; flex: none; transition: transform .25s cubic-bezier(.2,.8,.2,1), background .2s; }
  .sec-head:hover .chev { background: var(--fill-2); }
  .sec-head[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .sec-head span:last-child { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; min-width: 0; }
  .section.closed { margin-top: 10px; }
  .section.closed header { position: static; padding: 14px; border-radius: 22px; background: rgba(255,255,255,.04); border: 1px solid var(--glass-line); transition: background .2s; }
  .section.closed header:hover { background: rgba(255,255,255,.07); }
  .covers { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 12px 0 0 42px; }
  .covers img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 10px; display: block; background: #111; }
  .section.closed header { display: block; }
  /* Subfolders inside an open project, like the Finder: closed ones show covers and numbers */
  .sub { margin: 4px 0 6px; padding: 10px 12px; border-radius: 18px; background: rgba(255,255,255,.03); border: 1px solid var(--glass-line); }
  .sub + .sub { margin-top: 8px; }
  .sub-head .chev { width: 24px; height: 24px; }
  .sub-head h3 { margin: 0; font: 600 17px/1.2 -apple-system, "SF Pro Display", sans-serif; letter-spacing: -.01em; }
  .sub-head p { margin: 0; color: var(--ink-2); font-size: 12.5px; }
  .sub .covers { grid-template-columns: repeat(8, 1fr); gap: 6px; margin: 10px 0 0 38px; }
  .sub .covers img { border-radius: 8px; }
  .sub .grid { margin-top: 12px; }
  .loose { margin: 22px 0 12px; font: 600 15px/1.2 -apple-system, sans-serif; color: var(--ink-2); }

  .empty { max-width: 520px; margin: 14vh auto; text-align: center; }
  .empty h2 { font: 700 24px/1.2 -apple-system, "SF Pro Display", sans-serif; letter-spacing: -.02em; margin: 0 0 8px; }
  .empty p { color: var(--ink-2); margin: 0; }
  code { background: var(--fill); padding: 2px 7px; border-radius: 6px; font: 500 13px ui-monospace, "SF Mono", monospace; }

  /* Quick Look style sheet */
  .veil { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.45); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); display: grid; place-items: center; padding: 24px; opacity: 0; pointer-events: none; transition: opacity .22s; }
  .veil.open { opacity: 1; pointer-events: auto; }
  .sheet { width: min(1180px, 100%); max-height: calc(100vh - 48px); border-radius: 26px; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(320px, 1fr); grid-template-rows: minmax(0, 1fr); background: var(--glass-strong); transform: scale(.97) translateY(8px); transition: transform .28s cubic-bezier(.2,.8,.2,1); box-shadow: 0 40px 120px rgba(0,0,0,.7), inset 0 1px 0 var(--glass-hi); }
  .veil.open .sheet { transform: none; }
  .viewer { background: var(--bg); display: flex; flex-direction: column; min-height: 0; }
  .viewer .big { position: relative; flex: 1; min-height: 280px; display: grid; place-items: center; }
  .viewer .big img, .viewer .big video { width: 100%; height: 100%; max-height: 66vh; object-fit: contain; display: block; background: var(--bg); }
  .playbtn { position: absolute; width: 76px; height: 76px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center; color: var(--ink);
    background: rgba(255,255,255,.16); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
    box-shadow: 0 12px 34px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.28); transition: transform .2s, background .2s; }
  .playbtn:hover { transform: scale(1.07); background: rgba(255,255,255,.26); }
  .playbtn svg { margin-left: 5px; }
  .pbar { display: flex; align-items: center; gap: 12px; padding: 10px 14px 4px; background: #0a0a0a; }
  .pbar button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--fill-2); cursor: pointer; display: grid; place-items: center; flex: none; }
  .pbar input { flex: 1; min-width: 0; accent-color: var(--ink); height: 4px; cursor: pointer; }
  .pbar .tc { font-variant-numeric: tabular-nums; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
  .pmsg { position: absolute; left: 50%; bottom: 14px; translate: -50% 0; padding: 6px 14px; border-radius: 999px; font-size: 12.5px; background: rgba(0,0,0,.6); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); color: var(--ink-2); white-space: nowrap; pointer-events: none; }
  .strip { display: flex; gap: 6px; padding: 10px; background: #0a0a0a; }
  .strip button { flex: 1; aspect-ratio: 16/9; border: 0; padding: 0; border-radius: 8px; overflow: hidden; cursor: pointer; opacity: .55; transition: opacity .15s; outline-offset: 0; }
  .strip button.on { opacity: 1; outline: 2px solid var(--ink); }
  .strip img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .info { padding: 24px 24px 28px; overflow-y: auto; }
  .info h3 { margin: 0; font: 700 24px/1.15 -apple-system, "SF Pro Display", sans-serif; letter-spacing: -.02em; word-break: break-word; padding-right: 36px; }
  .info .sub { color: var(--ink-2); margin: 4px 0 18px; }
  .x { position: absolute; top: 16px; right: 16px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--fill-2); cursor: pointer; display: grid; place-items: center; }
  .facts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
  .fact { padding: 6px 12px; border-radius: 999px; background: var(--fill); font-size: 13px; font-variant-numeric: tabular-nums; }
  .fact b { font-weight: 600; }
  .card { border-radius: 16px; background: rgba(255,255,255,.05); border: 1px solid var(--glass-line); padding: 14px 16px; margin-bottom: 12px; }
  .card h4 { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .loc + .loc { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--glass-line); }
  .loc .disk { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .loc .disk em { font-style: normal; font-weight: 400; color: var(--ink-3); font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
  .dot.on { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .loc .path { color: var(--ink-2); font-size: 12.5px; word-break: break-all; margin: 4px 0 10px; }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .act { height: 30px; padding: 0 14px; border-radius: 999px; border: 0; background: var(--fill-2); cursor: pointer; font-size: 13px; font-weight: 500; }
  .act.primary { background: var(--accent); color: var(--on-accent); }
  .act:disabled { opacity: .4; cursor: default; }
  dl { display: grid; grid-template-columns: 8.5em 1fr; gap: 7px 12px; margin: 0; font-size: 13px; }
  dt { color: var(--ink-3); }
  dd { margin: 0; word-break: break-word; font-variant-numeric: tabular-nums; }
  details summary { cursor: pointer; color: var(--ink-2); font-size: 13px; }
  details pre { font: 11.5px/1.5 ui-monospace, "SF Mono", monospace; color: var(--ink-2); white-space: pre-wrap; word-break: break-all; margin: 10px 0 0; }

  /* Duplicates and drives */
  .lead { margin: 34px 0 6px; font: 700 30px/1.15 -apple-system, "SF Pro Display", sans-serif; letter-spacing: -.025em; max-width: 26ch; }
  .lead-sub { color: var(--ink-2); max-width: 64ch; margin: 0 0 24px; }
  .dups { display: grid; gap: 12px; }
  .dupe { display: grid; grid-template-columns: 168px minmax(0, 1fr) auto; gap: 18px; align-items: center; padding: 12px; border-radius: 20px; }
  .dupe img { width: 168px; aspect-ratio: 16/9; object-fit: cover; border-radius: 12px; display: block; background: #111; }
  .dupe b { font-weight: 600; font-size: 15px; }
  .dupe ul { list-style: none; margin: 4px 0 0; padding: 0; color: var(--ink-2); font-size: 12.5px; }
  .dupe li { overflow-wrap: anywhere; }
  .dupe li strong { color: var(--ink); font-weight: 600; margin-right: 6px; }
  .save { text-align: right; padding-right: 8px; font-variant-numeric: tabular-nums; }
  .save strong { display: block; font: 700 22px/1 -apple-system, "SF Pro Display", sans-serif; color: var(--teal); }
  .save span { color: var(--ink-3); font-size: 12px; }
  .disks { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; margin-top: 30px; }
  .disk-card { border-radius: 24px; padding: 22px; }
  .disk-card h3 { margin: 0; display: flex; align-items: center; gap: 10px; font: 700 26px/1.1 -apple-system, "SF Pro Display", sans-serif; letter-spacing: -.02em; }
  .disk-card .sub { color: var(--ink-2); margin: 4px 0 16px; font-size: 13px; }
  .meter { height: 10px; border-radius: 999px; background: var(--fill); overflow: hidden; display: flex; margin-bottom: 8px; }
  .meter i { height: 100%; display: block; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); margin-bottom: 16px; }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  /* Decisions */
  .chip.sep { margin-left: 10px; }
  .vote { display: flex; gap: 6px; margin-bottom: 18px; }

  let l; try { l = await post('/api/decide', { content: cur.r.content, kind, value }); } catch (e) { toast(e.message); return; }
  if (kind === 'hide') c.hidden = value.split(' ').filter(Boolean).map(Number);
  else Object.assign(c, { checked: value === 'yes', checked_by: l.by, checked_at: l.t });
  if (cur?.c === c) $('#sheet .card.said').outerHTML = speechCard(c);
}
/* ---------- Player ---------- */
// direct: the original file, native seeking. live: converted on the fly, every seek reopens the stream from that point.
let P = null;
const ICON_PLAY = '<svg width="12" height="14" viewBox="0 0 12 14"><path d="M1 1.2v11.6a.8.8 0 0 0 1.2.7l9.3-5.8a.8.8 0 0 0 0-1.4L2.2.5A.8.8 0 0 0 1 1.2z" fill="currentColor"/></svg>';
const ICON_PAUSE = '<svg width="12" height="14" viewBox="0 0 12 14"><rect x="1" y="1" width="3.5" height="12" rx="1" fill="currentColor"/><rect x="7.5" y="1" width="3.5" height="12" rx="1" fill="currentColor"/></svg>';
// From the drive when it is connected; otherwise the team's light copy (proxy), from the store.
async function startPlay(at = 0) {
  const c = cur?.c, l = c?.locations?.find(x => x.online);
  let proxy = null;
  if (!l) {
    if (!(ME.site ? c?.proxy : ME.team)) return toast(t('player.connect'));
    try { proxy = (await api('/api/proxy/' + encodeURIComponent(cur.r.thumb))).url; } catch (e) { return toast(e.message); }
    if (cur?.c !== c) return;
  }
  const big = $('.viewer .big');
  big.innerHTML = `<video playsinline autoplay></video><span class="pmsg" hidden></span>`;
  big.insertAdjacentHTML('afterend', `<div class="pbar"><button data-pp aria-label="${t('player.pause')}">${ICON_PAUSE}</button>
    <input type="range" min="0" max="${num(c.dur)}" step="0.1" value="0" aria-label="${t('player.position')}"><span class="tc"></span></div>`);
  const v = $('video', big), bar = $('.pbar input');
  P = { v, live: !proxy && !c.direct, dur: num(c.dur), offset: 0, drag: false,
        url: proxy || `/api/play?device=${encodeURIComponent(l.device)}&id=${encodeURIComponent(l.id)}`,
        note: proxy ? t('player.light') : c.direct ? '' : t('player.live') };
  const msg = x => { const m = $('.pmsg'); if (m) { m.textContent = x; m.hidden = !x; } };
  v.addEventListener('timeupdate', () => { if (P && !P.drag) bar.value = playPos(); tc(); });
  v.addEventListener('play', () => { const b = $('[data-pp]'); if (b) { b.innerHTML = ICON_PAUSE; b.ariaLabel = t('player.pause'); } });
  v.addEventListener('pause', () => { const b = $('[data-pp]'); if (b) { b.innerHTML = ICON_PLAY; b.ariaLabel = t('player.play'); } });
  v.addEventListener('waiting', () => msg(t('player.loading')));
  v.addEventListener('playing', () => msg(P?.note));
  v.addEventListener('error', () => P && msg(t('player.error')));
  bar.addEventListener('input', () => { P.drag = true; tc(); });
  bar.addEventListener('change', () => { P.drag = false; seek(bar.value); });
  seek(at);
}
const playPos = () => P.live ? P.offset + P.v.currentTime : P.v.currentTime;
function tc() { if (P) $('.pbar .tc').textContent = `${dur(P.drag ? $('.pbar input').value : playPos())} / ${dur(P.dur)}`; }
function seek(x) {
  x = Math.max(0, Math.min(num(x), P.dur - 0.5));
  if (P.live) { P.offset = x; P.v.src = `${P.url}&t=${x.toFixed(2)}`; }
  else if (!P.v.getAttribute('src')) P.v.src = `${P.url}#t=${x.toFixed(2)}`;
  else P.v.currentTime = x;
  P.v.play().catch(() => {}); tc();
}
// Removing the source closes the stream: the engine stops the conversion
function stopPlay() { if (!P) return; const v = P.v; P = null; v.pause(); v.removeAttribute('src'); v.load(); }
function closeClip() { stopPlay(); $('#veil').classList.remove('open'); $('#veil').setAttribute('aria-hidden', 'true'); cur = null; $(`.tile[data-i="${sel}"]`)?.focus(); refreshTray(); }

/* ---------- Decisions ---------- */
// Pressing the same decision again clears it. Returns true when a new decision was saved.
async function vote(i, v) {
  const r = ROWS[i]; if (!r) return false;
  const next = r.vote === v ? '' : v;
  let line; try { line = await post('/api/decide', { content: r.content, kind: 'vote', value: next }); } catch (e) { toast(e.message); return false; }
  r.vote = next || null;
  if (cur?.r === r && $('#voteby')) $('#voteby').innerHTML = byLine(next, line.by, line.t);
  const el = $(`.tile[data-i="${i}"]`); if (el) el.outerHTML = tile(i);
  if (cur?.r === r) $$('.vote button').forEach(b => b.setAttribute('aria-pressed', b.dataset.vote === r.vote));
  toast(next ? t('toast.vote', { vote: VOTES[next], name: r.name }) : t('toast.cleared', { name: r.name }));
  refreshTray();
  return !!next;
}
async function keepCopy(content, key) {
  try { await post('/api/decide', { content, kind: 'copy', value: key }); } catch (e) { toast(e.message); return; }
  toast(t('toast.keepConfirmed')); refreshTray();
}
function nextTile() { const tiles = $$('.tile').map(x => +x.dataset.i); return tiles[tiles.indexOf(sel) + 1]; }

  const k = e.target.closest('.strip button');

  if (hl) return transcriptDecide('hide', [...(cur.c.hidden || []).filter(s => s !== +hl.dataset.show), ...(hl.dataset.hide ? [+hl.dataset.hide] : [])].join(' '));
  if (e.target.closest('[data-check]')) return transcriptDecide('check', cur.c.checked ? '' : 'yes');

    return post('/api/forget/' + encodeURIComponent(cur.r.thumb)).then(() => { toast(t('forget.done')); openClip(sel); }, err => toast(err.message));

/* ---------- Keyboard selection ---------- */
function select(i) {
  $$('.tile.sel').forEach(x => x.classList.remove('sel'));
  sel = i; const el = $(`.tile[data-i="${i}"]`);
  if (el) { el.classList.add('sel'); el.focus({ preventScroll: true }); el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
}
function moveSel(dx, dy) {
  const tiles = $$('.tile'); if (!tiles.length) return;
  const curT = $(`.tile[data-i="${sel}"]`) || tiles[0];
  if (sel < 0) return select(+tiles[0].dataset.i);
  const a = curT.getBoundingClientRect(); let best = null, bd = Infinity;
  for (const x of tiles) {
    if (x === curT) continue; const b = x.getBoundingClientRect();
    const ddx = b.left - a.left, ddy = b.top - a.top;
    if (dx && Math.sign(ddx) !== dx || dx && Math.abs(ddy) > 4) continue;
    if (dy && (Math.sign(ddy) !== dy || Math.abs(ddy) < 4)) continue;
    const d = dy ? Math.abs(ddy) * 1000 + Math.abs(ddx) : Math.abs(ddx);
    if (d < bd) { bd = d; best = x; }
  }
  if (best) select(+best.dataset.i);
}

let DUPS = [];
async function renderDups() {

    <div><b>${esc(x.name)}</b><ul role="radiogroup" aria-label="${t('dup.pick')}">${x.locations.map(l => { const on = locKey(l) === keep;
      return `<li><button role="radio" data-pick="${esc(locKey(l))}" aria-checked="${on && !!x.copy}"${on && !x.copy ? ' class="prop"' : ''}${x.conflict ? ' disabled' : ''}><span class="r"></span><span><strong>${esc(l.disk)}</strong> ${esc(l.id)}</span></button></li>`; }).join('')}</ul>

$('#view').addEventListener('click', async e => {

/* ---------- Drives ---------- */
// A choice of a drive as a switch in its own row: on, or off with what turning it on would cost. local is the one
// stored the other way round: its switch says "Send to the team".
const isOn = (d, k) => k === 'local' ? d.local !== true : d[k] === true;
const optRow = (d, k, label, cost, text = isOn(d, k) ? t('opt.on') : t('opt.off', { cost })) => `<dt>${label}</dt><dd class="opt"><button class="switch" role="switch" aria-checked="${isOn(d, k)}"
  aria-label="${label}" data-opt="${k}" data-uuid="${esc(d.uuid)}" data-val="${isOn(d, k) === (k === 'local') ? 1 : 0}"></button><span>${text}</span></dd>`;
// Search by content, timed on a MacBook Pro M5 Pro (Mac17,8, on battery) on 12 November 2026 at background
// priority (taskpolicy -b), on the demo drive shoot-a: Apple Vision and SigLIP 2 look at the 5 previews of a
// clip in 0.2 s (81 clips in 16 s); Whisper takes 2.9 s per clip to take out the audio and load the model
// (8 clips in 23.4 s), plus 0.043 s per second of speech (384 s of continuous speech in 16.4 s; silence and
// music are skipped, so most footage goes faster). Not measured on Windows: no estimate there.
const LOOK_PER_CLIP = 0.2, LISTEN_PER_CLIP = 2.9, LISTEN_PER_SECOND = 0.043;
// The same words in the setup of a new drive and on its card; ST.models.need: what is not on this computer yet.
const contentWhat = (shared = ME.team) => t(shared ? 'content.whatShared' : 'content.whatLocal', { pc: PC() })
  + (num(ST.models?.need) ? t('content.models', { size: bytes(ST.models.need) }) : '');
const modelsFailed = m => t('models.failed', { error: m.error });
function contentText(d) {
  const [looked, heard] = ST.content?.[d.uuid] || [0, 0], k = num(d.clips), m = ST.models || {}, need = num(m.need);
  const left = (k - looked) * LOOK_PER_CLIP + (k - heard) * (LISTEN_PER_CLIP + num(d.seconds) / Math.max(k, 1) * LISTEN_PER_SECOND);
  const est = ME.windows || left < 1 ? '' : human(left);
  if (d.content !== true) return t('content.off', { what: contentWhat(ME.team && d.local !== true) }) + (est ? t('content.takes', { time: est }) : '');
  if (looked >= k && heard >= k) return t('content.ready');
  const listen = need && m.error ? modelsFailed(m)
    : need ? (m.done ? t('content.downloading', { done: bytes(m.done), size: bytes(need) }) : t('content.startsAfter', { size: bytes(need) }))
    : t('content.listened', { heard, n: k }) + (d.online ? '' : t('content.rest'));
  return (ST.paused ? t('content.paused', { why: I18N.from(ST.paused) }) : '') + t('content.progress', { looked, clips: clips(k), listen }) + (est ? t('content.left', { time: est }) : '');
}

});

const emptyCatalog = () => ME.site

const errorBox = m => `<div class="empty"><h2>${t('err.catalog')}</h2><p>${esc(m)}</p></div>`;

/* ---------- Navigation ---------- */
function show(view) {

  $('#searchbar').hidden = view !== 'archive';

$$('.seg button').forEach(b => b.addEventListener('click', () => show(b.dataset.view)));

$('#field').addEventListener('click', e => {
  const rm = e.target.closest('[data-rm]'); if (rm) { removeToken(+rm.dataset.rm); return; }
  $('#q').focus();
});
$('#q').addEventListener('input', e => { sugIdx = 0; openSuggest(e.target.value); if (!e.target.value && S.q) { S.q = ''; load(); } });
$('#q').addEventListener('focus', e => e.target.value && openSuggest(e.target.value));
$('#q').addEventListener('blur', () => setTimeout(closeSuggest, 150));
$('#q').addEventListener('keydown', e => {
  const open = $('#suggest').classList.contains('open');
  if (e.key === 'ArrowDown' && open) { e.preventDefault(); sugIdx = (sugIdx + 1) % SUG.length; openSuggest(e.target.value); }
  else if (e.key === 'ArrowUp' && open) { e.preventDefault(); sugIdx = (sugIdx - 1 + SUG.length) % SUG.length; openSuggest(e.target.value); }
  else if (e.key === 'Enter') { e.preventDefault(); open ? pickSuggest(sugIdx) : (S.q = e.target.value.trim(), load()); }
  else if (e.key === 'Backspace' && !e.target.value && S.tokens.length) removeToken(S.tokens.length - 1);
  else if (e.key === 'Escape') { closeSuggest(); e.target.blur(); }
  else if (e.key === 'ArrowDown' && !open) { e.preventDefault(); e.target.blur(); moveSel(0, 1); }
});
$('#suggest').addEventListener('mousedown', e => { const b = e.target.closest('[data-s]'); if (b) { e.preventDefault(); pickSuggest(+b.dataset.s); } });

$('#quick').innerHTML = FLAGS.map(([v, l, c]) => `<button class="chip${v === 'undecided' || v === 'suggest-discard' ? ' sep' : ''}" data-flag="${v}" aria-pressed="false"><i style="background:${c}"></i>${l}</button>`).join('');
$('#quick').addEventListener('click', e => {

  const i = S.tokens.findIndex(x => x.type === 'flag' && x.value === c.dataset.flag);
  if (i >= 0) removeToken(i); else addToken({ type: 'flag', value: c.dataset.flag, text: FLAGS.find(f => f[0] === c.dataset.flag)[1], label: '' });
});

$('#sortmenu').innerHTML = SORTS.map(([v, l]) => `<button role="menuitemradio" data-sort="${v}">${l}</button>`).join('');
$('#sortbtn').addEventListener('click', () => { const m = $('#sortmenu'); m.classList.toggle('open'); $('#sortbtn').setAttribute('aria-expanded', m.classList.contains('open')); });
// The drive menu: the archive of one drive, connected drives first (the order of Drives).
$('#drivebtn').addEventListener('click', () => {
  const m = $('#drivemenu'), cur = S.tokens.find(x => x.type === 'device')?.value || '';
  m.innerHTML = [['', t('drives.all'), true], ...OV.devices.filter(d => !d.retired).map(d => [d.uuid, d.name, d.online])]
    .map(([v, l, on]) => `<button role="menuitemradio" aria-checked="${v === cur}" data-drive="${esc(v)}">${v ? `<i class="dot${on ? ' on' : ''}"></i>` : ''}${esc(l)}</button>`).join('');

$('#drivemenu').addEventListener('click', e => {

$('#sortmenu').addEventListener('click', e => {

  S.sort = b.dataset.sort; $('#sortlabel').textContent = b.textContent; $('#sortmenu').classList.remove('open'); load();
});
document.addEventListener('click', e => {
  if (!e.target.closest('.sort')) { $('#sortmenu').classList.remove('open'); $('#drivemenu').classList.remove('open'); }
  const tg = e.target.closest('[data-toggle]');
  if (tg && !S.q) { toggleProject(tg.dataset.toggle, tg.dataset.folder); return; }
  const od = e.target.closest('[data-ondisk]'); // a drive: the archive shows only its clips
  if (od) { addToken({ type: 'device', value: od.dataset.ondisk, text: od.dataset.name, label: t('label.drive') }); return; }
  const more = e.target.closest('[data-more]');
  if (more) { const { more: proj, folder } = more.dataset;
    const idx = ROWS.map((r, i) => [r, i]).filter(([r]) => S.sort || r.project === proj && (r.folder || '') === folder).map(([, i]) => i);
    more.previousElementSibling.innerHTML = idx.map(tile).join(''); more.remove(); return; }
  const el = e.target.closest('.tile'); if (el) openClip(+el.dataset.i);
  if (e.target.closest('[data-plan]')) openPlan();
});
document.addEventListener('keydown', e => {
  const typing = document.activeElement?.tagName === 'INPUT';
  if ((e.metaKey && e.key === 'k') || (e.key === '/' && !typing)) { e.preventDefault(); if (S.view !== 'archive') show('archive'); $('#q').focus(); return; }
  if ($('#veil').classList.contains('open')) {
    if (e.key === ' ' && P && e.target.tagName !== 'INPUT') { e.preventDefault(); P.v.paused ? P.v.play() : P.v.pause(); return; }
    if (e.key === 'Enter' && cur && !P && e.target.tagName !== 'BUTTON') { e.preventDefault(); startPlay(); return; }
    if (e.key === 'Escape' || (e.key === ' ' && cur)) { e.preventDefault(); closeClip(); }
    const v = !e.metaKey && !e.ctrlKey && VOTE_KEYS[e.key.toLowerCase()];
    if (v && cur) { e.preventDefault(); const nx = nextTile(); vote(sel, v).then(set => set && nx !== undefined && setTimeout(() => openClip(nx), 220)); }
    if (cur && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { e.preventDefault(); const tiles = $$('.tile').map(x => +x.dataset.i), p = tiles.indexOf(sel) + (e.key === 'ArrowRight' ? 1 : -1); if (tiles[p] !== undefined) openClip(tiles[p]); }
    return;
  }
  if (typing || S.view !== 'archive') return;
  const mv = { ArrowRight: [1, 0], ArrowLeft: [-1, 0], ArrowDown: [0, 1], ArrowUp: [0, -1] }[e.key];
  if (mv) { e.preventDefault(); moveSel(...mv); }
  if ((e.key === ' ' || e.key === 'Enter') && sel >= 0) { e.preventDefault(); openClip(sel); }
  const v = !e.metaKey && !e.ctrlKey && VOTE_KEYS[e.key.toLowerCase()];
  if (v && sel >= 0) { e.preventDefault(); const i = sel, nx = nextTile(); vote(i, v).then(set => { if (set && nx !== undefined) select(nx); else select(i); }); }
});

/* ---------- New drives and scan progress ---------- */
// The engine finds drives by itself: new ones wait for the setup below, a known one is scanned again.
// The catalog (files, details, previews) always runs; the heavy work is chosen per drive and is off unless
// ticked: search by content (hours of work on this computer) and light copies for the team (upload).
let STATUS = '', PENDING = [], WIZ = {}, VERSION, ST = {};
const X_BUTTON = `<button class="x" aria-label="${t('close')}" data-close><svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 1l8 8M9 1L1 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>`;
const WIZ_SEEN = new Set(), COPY_PER_HOUR = 1.41e9; // light copies: 3 Mbit/s of video and 128 kbit/s of audio
const wizardOpen = () => $('#veil').classList.contains('open') && !!$('[data-wstart]');
function wizRow(p) {
  const w = WIZ[p.uuid] ||= { catalog: true, content: false, team: true, copies: false, name: p.name, excluded: null };
  return `<div class="card wiz" data-w="${esc(p.uuid)}">
    <div class="wiz-head"><label class="fold"><input type="checkbox" data-wk="catalog"${w.catalog ? ' checked' : ''}><b>${t('wiz.catalog')}</b></label>
      <input class="wname" data-wk="name" value="${esc(w.name)}" aria-label="${t('wiz.name')}"><span class="note">${t('wiz.used', { size: bytes(num(p.size) - num(p.free)) })}</span></div>
    <div class="wopts"${w.catalog ? '' : ' hidden'}>
      <label class="fold"><input type="checkbox" data-wk="content"${w.content ? ' checked' : ''}><span>${t('wiz.content', { what: contentWhat() })}</span></label>
      ${ME.team ? `<label class="fold"><input type="checkbox" data-wk="team"${w.team ? ' checked' : ''}><span>${t('wiz.team', { team: esc(ME.team.team), pc: PC() })}</span></label>` : ''}
      ${ME.team ? `<label class="fold"><input type="checkbox" data-wk="copies"${w.copies ? ' checked' : ''}><span>${t('wiz.copies', { size: bytes(COPY_PER_HOUR) })}</span></label>` : ''}
      <button class="act" data-wfolders="${esc(p.uuid)}">${w.excluded?.length ? t('wiz.skipped', { n: w.excluded.length }) : t('drive.folders')}</button></div>
    <p class="note"${w.catalog ? ' hidden' : ''}>${t('wiz.ignore')}</p></div>`;
}
function openWizard() {
  const sheet = $('#sheet'), k = PENDING.length; sheet.className = 'sheet plan';
  sheet.innerHTML = `<div class="plan" style="position:relative">${X_BUTTON}
    <h3>${t('wiz.title', { n: k })}</h3>
    <p class="sub">${t('wiz.sub', { n: k })}</p>
    ${PENDING.map(wizRow).join('')}
    <p class="note">${ME.windows ? t('wiz.pauseWin') : t('wiz.pauseMac')}</p>
    <div class="go"><button class="act primary" data-wstart>${t('wiz.start')}</button><button class="act" data-close>${t('wiz.later')}</button></div></div>`;
  $('#veil').classList.add('open'); $('#veil').setAttribute('aria-hidden', 'false');
  $('[data-wstart]', sheet).focus();
}
async function startWizard(btn) {
  btn.disabled = true;
  let started = 0;
  for (const p of PENDING) {
    const w = WIZ[p.uuid]; if (!w) continue;
    const body = w.catalog ? { uuid: p.uuid, action: 'catalog', name: w.name, content: w.content, local: !!ME.team && !w.team, copies: !!ME.team && w.team && w.copies } : { uuid: p.uuid, action: 'ignore' };
    if (w.catalog && w.excluded) body.excluded = w.excluded;
    try { await post('/api/drives', body); started += w.catalog; } catch (e) { toast(e.message); btn.disabled = false; return; }
  }
  closeClip(); toast(started ? t('wiz.started') : t('wiz.ignored')); poll();
}
$('#sheet').addEventListener('input', e => {
  const k = e.target.dataset.wk, row = e.target.closest('[data-w]'); if (!k || !row) return;
  const w = WIZ[row.dataset.w]; w[k] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
  if (k === 'catalog') { $('.wopts', row).hidden = !w.catalog; $('.note', row).hidden = w.catalog; }
});
async function poll() {
  let st; try { st = await api('/api/status'); } catch { return; }
  ST = st;
  const was = PENDING.map(p => p.uuid).join(); PENDING = st.pending;
  // A new drive opens the setup by itself once, when nothing else is open (the license, a clip).
  const free = !$('#veil').classList.contains('open'), fresh = free ? PENDING.filter(p => !WIZ_SEEN.has(p.uuid)) : [];
  fresh.forEach(p => WIZ_SEEN.add(p.uuid));
  if (wizardOpen() ? was !== PENDING.map(p => p.uuid).join() && PENDING.length : fresh.length) openWizard();
  else if (wizardOpen() && !PENDING.length) closeClip();
  const b = $('#banner'), wait = PENDING.length && !$('#veil').classList.contains('open');
  if (wait) b.innerHTML = `<span>${PENDING.length === 1 ? t('banner.one', { name: esc(PENDING[0].name) }) : t('wiz.title', { n: PENDING.length })}</span><button class="act primary" data-wopen>${t('banner.setup')}</button>`;
  b.classList.toggle('show', !!wait);
  const pct = st.total ? Math.min(100, Math.floor(num(st.done) / num(st.total) * 100)) : null;
  const cannot = (st.unreadable || []).map(d => t(ME.windows ? 'unreadable.fromMac' : 'unreadable.fromPC', { name: d.name, pc: PC(), fs: d.fs || '' }));
  const m = st.models || {}, dl = !num(m.need) || !OV?.devices.some(d => d.content === true) ? ''
    : m.error ? t('models.failedNote', { why: modelsFailed(m) }) : m.done ? t('models.downloading', { done: bytes(m.done), size: bytes(m.need) }) : '';
  $('#bgnote').textContent = st.status ? '' : [...cannot, dl, I18N.from(st.background)].filter(Boolean).join(' ');
  $$('[data-opt="content"]').forEach(o => { const d = OV.devices.find(x => x.uuid === o.dataset.uuid); if (d) o.nextElementSibling.textContent = contentText(d); });
  if (st.status) $('#stat').innerHTML = `<span class="scanbar">${esc(I18N.from(st.status))}${pct !== null && st.step === 2 ? `, ${pct}%` : ''}</span>`;
  if (st.status && !OV?.devices.length) catalogProgress(st, pct);
  if (STATUS && !st.status) refresh();
  if (st.version !== undefined && VERSION !== undefined && st.version !== VERSION) refresh(); // the team site got new data
  VERSION = st.version;
  STATUS = st.status;
}
// The first catalog of a drive: which of the 4 steps is running and how far it is.
const STEPS = [t('step.read'), t('step.check'), t('step.previews'), t('step.look')];
function catalogProgress(st, pct) {
  if (!$('#catprog')) $('#view').innerHTML = `<div class="empty" id="catprog" role="status"><h2>${t('cat.title')}</h2>
    <p class="step"></p><div class="progress" role="progressbar" aria-label="${t('cat.progress')}"><i></i></div><p class="scanbar detail"></p>
    <p>${t('cat.note')}</p></div>`;
  const box = $('#catprog'), bar = $('.progress', box), k = num(st.step);
  $('.step', box).textContent = k ? t('cat.step', { k, step: STEPS[k - 1] }) : I18N.from(st.status);
  bar.classList.toggle('indet', pct === null);
  $('i', bar).style.width = pct === null ? '' : pct + '%';
  if (pct === null) bar.removeAttribute('aria-valuenow'); else bar.setAttribute('aria-valuenow', pct);
  $('.detail', box).textContent = k === 1 ? t('cat.read', { n: num(st.done) })
    : k === 2 && st.total ? t('cat.checked', { done: bytes(st.done), size: bytes(st.total), pct })
    : k >= 3 ? t('cat.of', { done: num(st.done), clips: clips(st.total), pct }) : '';
}
async function refresh() { try { OV = await api('/api/overview'); } catch {} show(S.view); refreshTray(); }
$('#banner').addEventListener('click', e => { if (e.target.closest('[data-wopen]')) { $('#banner').classList.remove('show'); openWizard(); } });
$('#view').addEventListener('click', async e => {
  const f = e.target.closest('[data-folders]'); if (f) return openFolders(f.dataset.folders, false);
  const td = e.target.closest('[data-tidy]'); if (td) return tidyStart(td);
  const tk = e.target.closest('[data-tidyai]');
  if (tk) {
    const clear = tk.dataset.clear !== undefined;
    try { await post('/api/tidy/ai', clear ? {} : { provider: $('#tidyprov').value, model: $('#tidymodel').value, url: $('#tidyurlrow').hidden ? '' : $('#tidyurl').value, key: $('#tidykey').value }); } catch (err) { toast(err.message); return; }
    toast(clear ? t('tidy.removed') : t('tidy.saved')); return tidyBox();
  }
  if (e.target.closest('[data-tidyundo]')) {
    if (!confirm(t('tidy.undoConfirm'))) return;
    try { const r = await post('/api/tidy/undo'); toast(r.error ? I18N.from(r.error) : t('tidy.putBack', { n: num(r.moved) })); } catch (err) { toast(err.message); } return tidyBox();
  }
  const wh = e.target.closest('[data-where]');
  if (wh) {
    const d = OV.devices.find(x => x.uuid === wh.dataset.where), loc = prompt(t('prompt.where'), d?.location || '');
    if (loc === null) return;
    try { await post('/api/drives', { uuid: wh.dataset.where, action: 'options', location: loc }); } catch (err) { toast(err.message); return; }
    return refresh();
  }
  const rt = e.target.closest('[data-retire]');
  if (rt) {
    const gone = rt.dataset.val === '1', d = OV.devices.find(x => x.uuid === rt.dataset.retire);
    if (gone && !confirm(t('confirm.gone', { name: d?.name }))) return;
    try { await post('/api/drives', { uuid: rt.dataset.retire, action: 'options', retired: gone }); } catch (err) { toast(err.message); return; }
    return refresh();
  }
  if (e.target.closest('details.dmore .menu')) e.target.closest('details.dmore').removeAttribute('open'); // a choice closes the menu
  const o = e.target.closest('[data-opt]');
  if (o) {
    const want = o.dataset.val === '1';
    try { await post('/api/drives', { uuid: o.dataset.uuid, action: 'options', [o.dataset.opt]: want }); } catch (err) { toast(err.message); return; }
    toast(o.dataset.opt === 'local' ? (want ? t('toast.local') : t('toast.sent'))
      : want ? t('toast.on') : t('toast.off')); return refresh();
  }
  const r = e.target.closest('[data-rename]'); if (!r) return;
  const d = OV.devices.find(x => x.uuid === r.dataset.rename), name = prompt(t('wiz.name'), d?.name || '');
  if (!name || name === d?.name) return;
  try { await post('/api/drives', { uuid: r.dataset.rename, action: 'rename', name }); } catch (err) { toast(err.message); return; }
  refresh();
});
// Folders to catalog: unticked ones are skipped (with every folder of the same name), before the first scan
// of a new drive or later from Drives, which scans it again.
async function openFolders(uuid, pending) {
  let fs; try { fs = await api('/api/folders?uuid=' + encodeURIComponent(uuid)); } catch (e) { toast(e.message); return; }
  const skip = pending && WIZ[uuid]?.excluded; if (skip) fs.forEach(f => { f.skipped = skip.includes(f.name); });
  const sheet = $('#sheet'); sheet.className = 'sheet plan';
  sheet.innerHTML = `<div class="plan" style="position:relative">
    <button class="x" aria-label="${t('close')}" data-close><svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 1l8 8M9 1L1 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    <h3>${t('folders.title')}</h3>
    <p class="sub">${t('folders.sub')}</p>
    <div class="card folders">${fs.map(f => `<label class="fold"><input type="checkbox" value="${esc(f.name)}"${f.skipped ? '' : ' checked'}>${esc(f.name)}</label>`).join('') || `<p class="sub">${t('folders.none')}</p>`}</div>
    <div class="go"><button class="act primary" data-savefolders="${esc(uuid)}" data-pending="${pending ? 1 : ''}">${pending ? t('done') : t('folders.save')}</button>${pending ? '' : `<button class="act" data-close>${t('cancel')}</button>`}</div></div>`;
  $('#veil').classList.add('open'); $('#veil').setAttribute('aria-hidden', 'false');
}
async function saveFolders(btn) {
  const excluded = $$('.fold input').filter(i => !i.checked).map(i => i.value);
  if (btn.dataset.pending) { WIZ[btn.dataset.savefolders].excluded = excluded; return openWizard(); } // back to the setup
  try { await post('/api/drives', { uuid: btn.dataset.savefolders, action: 'exclude', excluded }); } catch (e) { toast(e.message); return; }
  closeClip(); toast(t('folders.saved')); poll();
}
setInterval(poll, 2000);

// For owners: the database copies failed, are old or did not restore (deploy/backup.sh, deploy/restore-test.sh).
function backupNote(text) {
  document.body.insertAdjacentHTML('afterbegin', `<div class="backup-note" role="alert">${esc(t('backup.note', { alarm: I18N.from(text) }))}</div>`);
}

// The team site no longer accepts this computer (the app only): Team has the form to sign in again.
function signedOutNote() {
  document.body.insertAdjacentHTML('beforeend', `<div class="demo-note glass" role="note" data-signedout><span>${t('signedout.note', { pc: PC(), team: esc(ME.team.team) })}</span>
    <button class="act primary" data-signin>${t('signin.again')}</button></div>`);
  $('[data-signin]').addEventListener('click', () => { $('[data-signedout]').remove(); show('team'); });

// A newer version on the update site (the Windows app: the Mac app updates itself): the button downloads it.
function updateNote(u) {
  document.body.insertAdjacentHTML('beforeend', `<div class="demo-note glass" role="note" data-update><span>${t('update.available', { version: esc(u.version) })}</span>
    <button class="act primary" data-get>${t('update.get')}</button><button class="act" data-later>${t('update.later')}</button></div>`);
  $('[data-get]').addEventListener('click', () => { location.href = u.url; $('[data-update]').remove(); });
  $('[data-later]').addEventListener('click', () => $('[data-update]').remove());
}

// An app in no team asks Artide's site for new versions only if allowed: asked once, changed in Team.
// The Mac app downloads the new version by itself and installs it when it quits (Sparkle, macos/main.swift).
const UPDATES_TEXT = () => ME.windows ? t('updates.textWin') : t('updates.textMac');
function askUpdates() {
  if (ME.site || ME.team || ME.updates !== null) return;
  document.body.insertAdjacentHTML('beforeend', `<div class="demo-note glass" role="note" data-ask-updates><span>${ME.windows ? t('updates.askWin') : t('updates.askMac')} ${UPDATES_TEXT()}</span>
    <button class="act primary" data-ask="1">${t('yes')}</button><button class="act" data-ask="">${t('no')}</button></div>`);
  $('[data-ask-updates]').addEventListener('click', e => { const b = e.target.closest('[data-ask]'); if (b) setUpdates(!!b.dataset.ask).then(() => $('[data-ask-updates]')?.remove()); });
}
async function setUpdates(ask) {
  try { await post('/api/updates', { ask }); ME.updates = ask; } catch (e) { toast(e.message); }
}

api('/api/me').then(m => { ME = m; askUpdates(); if (m.team?.signed_out) signedOutNote(); if (m.update) updateNote(m.update); if (m.backup) backupNote(m.backup); }).catch(() => {}).then(() => api('/api/overview')).then(o => { OV = o; PAIR ? show('team') : o.devices.length ? show('archive') : ($('#view').innerHTML = emptyCatalog()); refreshTray(); poll(); })
  .catch(e => { $('#view').innerHTML = errorBox(e.message); });
</script>
